<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بازی پرتال زمان و معماهای بی‌نهایت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #050510;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            pointer-events: none;
            width: 90%;
        }
        h1 {
            margin: 0 0 3px 0;
            font-size: 18px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        p {
            margin: 0;
            font-size: 12px;
            color: #ccc;
        }
        /* جوستیک حرکتی موبایل */
        #joystick-base {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffcc;
            pointer-events: none;
        }
        /* دکمه بازگشت زمان (Rewind) */
        #rewind-btn {
            position: absolute;
            bottom: 40px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 71, 87, 0.8);
            border: 3px solid #ff4757;
            border-radius: 50%;
            color: #white;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
            touch-action: none;
            cursor: pointer;
        }
        #rewind-btn:active {
            background: #ff6b81;
            transform: scale(0.95);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 255, 204, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="level-title">معما شماره ۱: پیدا کردن عکس پرتال</h1>
        <p id="puzzle-desc">با جوستیک حرکت کن، عکس را پیدا کرده و روی دیوار بگذار.</p>
    </div>

    <div id="crosshair"></div>

    <!-- جوستیک لمسی برای موبایل -->
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <!-- دکمه نگه‌داشتن برای بازگشت به زمان قبل -->
    <div id="rewind-btn">برگشت زمان</div>

    <!-- کتابخانه Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let moveVector = { x: 0, y: 0 };
        let isRewinding = false;
        let positionHistory = []; // ذخیره موقعیت‌ها برای مکانیک بازگشت زمان

        let currentLevel = 1;
        let photoFound = false;
        let wall, portalMesh, collectiblePhoto;

        init();
        animate();

        function init() {
            // ۱. صحنه و دوربین اول‌شخص
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060612);
            scene.fog = new THREE.FogExp2(0x060612, 0.04);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // ۲. نورپردازی محیط تاریک و رازآلود
            const ambientLight = new THREE.AmbientLight(0x222244, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // ۳. زمین (شبیه زمین خاکی/دشت مسطح تاریک)
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x111625, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // ۴. ساختمان بلند (غیرقابل عبور در روبه‌رو)
            const wallGeo = new THREE.BoxGeometry(20, 25, 2);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x22223b, roughness: 0.5 });
            wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 12.5, -20);
            scene.add(wall);

            // ۵. عکس قابل جستجو و جمع‌آوری در محیط
            const photoGeo = new THREE.BoxGeometry(2, 3, 0.1);
            const photoMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
            collectiblePhoto = new THREE.Mesh(photoGeo, photoMat);
            collectiblePhoto.position.set(5, 1, -5);
            scene.add(collectiblePhoto);

            // ۶. دو دخترخانم کوچک در فضای بازی
            createLittleGirls();

            // ۷. کنترل‌های لمسی موبایل
            setupMobileControls();

            window.addEventListener('resize', onWindowResize);
        }

        function createLittleGirls() {
            const mat = new THREE.MeshStandardMaterial({ color: 0xff6b81 });
            
            // دختر اول
            const g1 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mat);
            g1.position.set(-6, 0.7, -8);
            scene.add(g1);

            // دختر دوم
            const g2 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mat);
            g2.position.set(6, 0.7, -8);
            scene.add(g2);
        }

        function setupMobileControls() {
            // جوستیک حرکتی
            const joystickBase = document.getElementById('joystick-base');
            const joystickStick = document.getElementById('joystick-stick');
            let joystickTouchId = null;
            let baseRect = joystickBase.getBoundingClientRect();

            joystickBase.addEventListener('touchstart', (e) => {
                if (joystickTouchId === null) {
                    let touch = e.changedTouches[0];
                    joystickTouchId = touch.identifier;
                    updateJoystick(touch);
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        joystickTouchId = null;
                        moveVector = { x: 0, y: 0 };
                        joystickStick.style.transform = `translate(0px, 0px)`;
                    }
                }
            });

            function updateJoystick(touch) {
                baseRect = joystickBase.getBoundingClientRect();
                let centerX = baseRect.left + baseRect.width / 2;
                let centerY = baseRect.top + baseRect.height / 2;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let maxDist = 40;

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVector.x = dx / maxDist;
                moveVector.y = dy / maxDist; // مثبت و منفی برای حرکت به جلو و عقب
            }

            // چرخش دوربین با لمس صفحه (Swipe)
            let isSwiping = false;
            let lastX = 0;
            window.addEventListener('touchstart', (e) => {
                if (e.target.id !== 'joystick-base' && e.target.id !== 'rewind-btn') {
                    isSwiping = true;
                    lastX = e.touches[0].clientX;
                }
            });
            window.addEventListener('touchmove', (e) => {
                if (isSwiping) {
                    let deltaX = e.touches[0].clientX - lastX;
                    camera.rotation.y -= deltaX * 0.005;
                    lastX = e.touches[0].clientX;
                }
            });
            window.addEventListener('touchend', () => isSwiping = false);

            // مکانیک دکمه بازگشت زمان (هرچه بیشتر فشار بدهی، بیشتر عقب می‌روی)
            const rewindBtn = document.getElementById('rewind-btn');
            rewindBtn.addEventListener('touchstart', () => isRewinding = true);
            rewindBtn.addEventListener('touchend', () => isRewinding = false);
        }

        function animate() {
            requestAnimationFrame(animate);

            // ذخیره موقعیت برای بازگشت زمان
            if (!isRewinding) {
                positionHistory.push(camera.position.clone());
                if (positionHistory.length > 300) positionHistory.shift(); // ذخیره 5 ثانیه اخیر
            } else {
                // اگر دکمه زمان فشرده شد، موقعیت‌ها را برعکس بازگردان
                if (positionHistory.length > 0) {
                    let pastPos = positionHistory.pop();
                    camera.position.copy(pastPos);
                }
            }

            // حرکت بازیکن بر اساس جوستیک
            if (!isRewinding && (moveVector.x !== 0 || moveVector.y !== 0)) {
                let speed = 0.08;
                let dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                camera.position.addScaledVector(dir, -moveVector.y * speed);
                camera.position.x += moveVector.x * speed; // حرکت جانبی
            }

            // بررسی برخورد با عکس برای برداشتن آن
            if (!photoFound && camera.position.distanceTo(collectiblePhoto.position) < 2.5) {
                photoFound = true;
                scene.remove(collectiblePhoto);
                document.getElementById('puzzle-desc').innerText = "عکس پیدا شد! حالا نزدیک ساختمان شو و آن را روی دیوار بچرخان.";
                
                // نمایان شدن پرتال روی ساختمان به عنوان پاداش معما
                portalMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(4, 6),
                    new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, wireframe: true })
                );
                portalMesh.position.set(0, 10, -19);
                scene.add(portalMesh);
            }

            // بررسی عبور از پرتال برای رفتن به مرحله بعد
            if (photoFound && camera.position.z < -18) {
                currentLevel++;
                photoFound = false;
                scene.remove(portalMesh);
                camera.position.set(0, 1.6, 5); // بازنشانی موقعیت برای مرحله بعد
                
                // جابجایی عکس در مکان جدید و سخت‌تر شدن معما
                collectiblePhoto.position.set((Math.random() - 0.5) * 15, 1, -5 - currentLevel * 2);
                scene.add(collectiblePhoto);

                document.getElementById('level-title').innerText = `معما شماره ${currentLevel}`;
                document.getElementById('puzzle-desc').innerText = `محیط پیچیده‌تر شد! دنبال عکس بعدی در زمین بگرد.`;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
