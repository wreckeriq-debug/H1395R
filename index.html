<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی پرتال عکس و معماهای بی‌نهایت</title>
    <!-- بارگذاری فونت وزیرمتن برای زیبایی متن‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0b16;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #00ffcc;
        }
        p {
            margin: 0;
            font-size: 14px;
            color: #ddd;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            border: 1px solid #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            text-align: center;
        }
        button {
            background: #00ffcc;
            border: none;
            padding: 8px 16px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
            pointer-events: auto;
            transition: 0.2s;
        }
        button:hover {
            background: #00cca3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="level-title">معما شماره ۱</h1>
        <p id="puzzle-desc">عکس پرتال را روی ساختمان بچرخان و فعال کن تا عبور کنی!</p>
        <button id="action-btn" onclick="activatePortal()">قرار دادن و چرخش عکس (پرتال)</button>
    </div>

    <div id="crosshair"></div>

    <div id="controls-hint">
        حرکت با کلیدهای <b>W A S D</b> یا فلش‌ها | چرخش دوربین با ماوس
    </div>

    <!-- کتابخانه Three.js برای گرافیک سه‌بعدی -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        let currentLevel = 1;
        let portalActive = false;
        let wall, portalMesh, littleGirl1, littleGirl2;

        init();
        animate();

        function init() {
            // ۱. صحنه و دوربین
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0c1c);
            scene.fog = new THREE.FogExp2(0x0c0c1c, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // ۲. نورپردازی
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // ۳. زمین
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1b1b2f, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // ۴. دیوار بلند ساختمان (غیرقابل عبور مستقیم)
            const wallGeo = new THREE.BoxGeometry(15, 20, 1);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x33334d, roughness: 0.4 });
            wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 10, -10);
            scene.add(wall);

            // ۵. دو دختر خانم هشت‌ساله (کاراکترهای همراه در گوشه محیط)
            createLittleGirls();

            // ۶. دست‌های بازیکن (اول شخص)
            createPlayerHands();

            // ۷. رویدادهای کنترل و کیبورد/ماوس
            setupControls();

            window.addEventListener('resize', onWindowResize);
        }

        function createLittleGirls() {
            const girlMat1 = new THREE.MeshStandardMaterial({ color: 0xff6b81 });
            const girlMat2 = new THREE.MeshStandardMaterial({ color: 0xff4757 });
            
            // دختر اول
            const head1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), girlMat1);
            head1.position.set(-4, 0.8, -5);
            scene.add(head1);
            const body1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1, 16), girlMat1);
            body1.position.set(-4, 0, -5);
            scene.add(body1);

            // دختر دوم
            const head2 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), girlMat2);
            head2.position.set(4, 0.8, -5);
            scene.add(head2);
            const body2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1, 16), girlMat2);
            body2.position.set(4, 0, -5);
            scene.add(body2);
        }

        function createPlayerHands() {
            // شبیه‌سازی دست راست در دید اول شخص
            const handGeo = new THREE.BoxGeometry(0.25, 0.25, 0.8);
            const handMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const rightHand = new THREE.Mesh(handGeo, handMat);
            rightHand.position.set(0.4, -0.4, -0.6);
            camera.add(rightHand);
            scene.add(camera);
        }

        function activatePortal() {
            if (!portalActive) {
                // ساخت عکس تبدیل شده به پرتال روی دیوار
                const portalGeo = new THREE.PlaneGeometry(3, 5);
                const portalMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, wireframe: true });
                portalMesh = new THREE.Mesh(portalGeo, portalMat);
                portalMesh.position.set(0, 5 + (currentLevel * 0.5), -9.4);
                scene.add(portalMesh);

                portalActive = true;
                document.getElementById('puzzle-desc').innerText = "پرتال فعال شد! از آن رد شو تا وارد معما و طبقه بعدی شوی.";
                document.getElementById('action-btn').innerText = "رفتن به مرحله بعد";
            } else {
                // رفتن به معما و سطح بعدی (سخت‌تر شدن بی‌نهایت)
                currentLevel++;
                portalActive = false;
                scene.remove(portalMesh);
                
                document.getElementById('level-title').innerText = `معما شماره ${currentLevel}`;
                document.getElementById('puzzle-desc').innerText = `محیط پیچیده‌تر شد! عکس پرتال را با دقت بچرخان و روی ساختمان قرار ده.`;
                document.getElementById('action-btn').innerText = "قرار دادن و چرخش عکس (پرتال)";
                
                // جابجایی تصادفی‌تر دیوار یا تغییر رنگ برای چالش جدید
                wall.scale.y += 0.1;
                camera.position.set(0, 1.6, 5);
            }
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            });

            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                camera.rotation.y -= deltaX * 0.003;
                // محدود کردن زاویه نگاه عمودی
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x - deltaY * 0.003));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            document.addEventListener('mousemove', (e) => {
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

            camera.translateX(velocity.x * delta);
            camera.translateZ(velocity.z * delta);

            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
